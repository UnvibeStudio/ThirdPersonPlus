plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = mod_id
}
version = mod_version
group = mod_group_id

repositories {
	maven { url "https://maven.terraformersmc.com/releases" } // Mod Menu
	maven { url "https://maven.shedaniel.me/" }               // Cloth Config
	mavenCentral()                                            // MixinExtras
}

loom {
	mods {
		"thirdpersonplus" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// MC 26.1+ ships unobfuscated: use the com.mojang notation and no `mappings` declaration.
	minecraft "com.mojang:minecraft:${minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Cloth Config (settings screen) — optional at runtime
	implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_api_version}") {
		exclude group: "net.fabricmc.fabric-api"
		exclude module: "modmenu"
	}
	// Mod Menu — optional at runtime
	implementation "com.terraformersmc:modmenu:${modmenu_version}"

	// MixinExtras (annotations); the implementation is bundled by Fabric Loader at runtime.
	compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
	annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

	testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_jupiter_version}"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_jupiter_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_jupiter_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def props = [
			mod_id              : mod_id,
			mod_name            : mod_name,
			mod_version         : mod_version,
			mod_description     : mod_description,
			mod_license         : mod_license,
			mod_icon            : mod_icon,
			mod_url_home        : mod_url_home,
			mod_url_issue       : mod_url_issue,
			mod_url_src         : mod_url_src,
			loader_version      : loader_version,
			minecraft_version_min: minecraft_version_min,
			minecraft_version_max: minecraft_version_max,
	]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}
